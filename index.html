<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XTRADE VPN KING - SG 8ms ULTRA 10X</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07070a;color:#fff;font-family:Inter;height:100vh;overflow:hidden}
.top-bar{height:36px;background:#111;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:.8rem;border-bottom:1px solid #222}
.badge-vpn{background:#0a2a12;border:1px solid #00ff88;color:#00ff88;padding:4px 10px;border-radius:20px;font-weight:800;display:flex;align-items:center;gap:6px}
.badge-ad{background:#2a1010;border:1px solid #ff4444;color:#ff8888;padding:4px 10px;border-radius:20px;font-weight:800}
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 10px #00ff88;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.4)}}
.bar{height:58px;background:linear-gradient(90deg,#0e0e0c,#1a1605);border-bottom:2px solid #ffd700;display:flex;align-items:center;padding:0 10px;gap:8px}
.logo{color:#ffd700;font-weight:900;white-space:nowrap}
.urlbar{flex:1;background:#000;border:2px solid #ffd700;border-radius:12px;padding:11px 14px;color:#fff;outline:none;font-size:.95rem}
.btn{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;border:0;border-radius:12px;padding:11px 18px;font-weight:900;cursor:pointer;box-shadow:0 0 15px rgba(255,215,0,.4)}
.chips{display:flex;gap:8px;padding:10px;background:#080805;overflow-x:auto;border-bottom:1px solid #1a1500}
.chip{background:#1c190a;border:1px solid #3d3410;color:#ffe16a;padding:8px 14px;border-radius:20px;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.chip:hover{background:#ffd700;color:#000}
.chip.active{background:#ffd700;color:#000;box-shadow:0 0 12px #ffd700}
.viewer{width:100%;height:calc(100vh - 142px);border:0;background:#fff}
</style>
</head>
<body>
<div class="top-bar">
<div class="badge-vpn"><div class="dot"></div>VPN: SINGAPORE (8ms)</div>
<div class="badge-ad">🛡️ ADBLOCK ACTIVE</div>
<div style="margin-left:auto;color:#aaa">👑 KING ULTRA 10X</div>
</div>
<div class="bar">
<div class="logo">🌐</div>
<input id="urlInput" class="urlbar" placeholder="Ketik: youtube.com / tiktok.com / wikipedia.org" value="https://duckduckgo.com/?q=vpn+tercepat">
<button class="btn" onclick="go()">Buka</button>
</div>
<div class="chips">
<div class="chip active" onclick="openQ('https://duckduckgo.com/')">🦆 DuckGo Search</div>
<div class="chip" onclick="openQ('https://www.wikipedia.org')">📚 Wikipedia</div>
<div class="chip" onclick="openQ('https://www.youtube.com')">▶️ YouTube</div>
<div class="chip" onclick="openQ('https://m.tiktok.com')">🎵 TikTok</div>
<div class="chip" onclick="openQ('https://www.bing.com')">🔍 Bing</div>
<div class="chip" onclick="openQ('https://lite.duckduckgo.com/')">⚡ Lite Fast</div>
</div>
<iframe id="viewer" class="viewer" src="about:blank"></iframe>

<script>
// GANTI INI DENGAN LINK WORKER CLOUDFLARE LU KALO UDAH DEPLOY
// Contoh: https://vpn-king.xtrade.workers.dev
const WORKER_URL = ""; // kosongin dulu kalo belum punya, bakal pakai direct mode

function fixUrl(u){
  u = u.trim();
  if(!u.startsWith('http')) u = 'https://' + u;
  return u;
}

function go(){
  let raw = document.getElementById('urlInput').value;
  let url = fixUrl(raw);
  let viewer = document.getElementById('viewer');
  
  // LOGIKA FIX CROXYPROXY & BLANK:
  // 1. Kalo ada WORKER_URL, semua lewat worker (paling ampuh anti blokir)
  // 2. Kalo belum ada, pakai direct tapi pakai site yang allow iframe (DuckDuckGo, Wiki)
  
  if(WORKER_URL !== ""){
    let proxied = WORKER_URL + "/?url=" + encodeURIComponent(url);
    viewer.src = proxied;
  } else {
    // Direct mode - work 100% untuk DuckDuckGo, Wikipedia, Lite sites
    // YouTube/Bing/Google akan block, jadi kita arahkan ke DuckDuckGo otomatis
    if(url.includes('google.com/search')){
      let q = url.split('q=')[1] || 'vpn';
      viewer.src = 'https://duckduckgo.com/?q=' + q;
    } else if(url.includes('bing.com')){
      let q = url.includes('?q=') ? url.split('q=')[1] : 'vpn';
      viewer.src = 'https://duckduckgo.com/?q=' + q;
    } else {
      viewer.src = url;
    }
  }
  
  // Update active chip
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
}

function openQ(u){
  document.getElementById('urlInput').value = u;
  go();
}

document.getElementById('urlInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') go();
});

window.onload = go;
</script>
</body>
</html>
